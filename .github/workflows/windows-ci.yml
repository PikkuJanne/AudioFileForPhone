name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Supplementary Windows Server 2025 / ${{ matrix.edition }}
    runs-on: windows-2025
    # Retain the full suites plus the added 24-case worker fault regressions.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            edition: ps51
          - shell: pwsh
            edition: ps7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out the integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
          submodules: false
          lfs: false
          allow-unsafe-pr-checkout: false
      - name: Verify tools and run Windows checks
        env:
          CI_RUN_LABEL: run${{ github.run_id }}_${{ github.run_attempt }}
          CI_EDITION: ${{ matrix.edition }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP ('AFP-CI-' + [guid]::NewGuid().ToString('N'))
          $evidence = Join-Path $env:GITHUB_WORKSPACE ('docs/codex-v1/evidence/T17-dependencies-' + $env:CI_EDITION + '-' + $env:CI_RUN_LABEL + '.json')
          & (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Initialize-CiDependencies.ps1') -DestinationPath $destination -EvidencePath $evidence
          & (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/Invoke-CiChecks.ps1') -DependenciesPath $evidence -RunLabel $env:CI_RUN_LABEL
      - name: Verify media worker crash recovery with synthetic media
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Join-Path $env:GITHUB_WORKSPACE ('docs/codex-v1/evidence/T17-dependencies-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json')
          $dependencies = Get-Content -LiteralPath $record -Raw | ConvertFrom-Json
          $report = Join-Path $env:RUNNER_TEMP 'patch104-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Patch104Recovery.ps1') -EvidencePath $report -FfmpegPath $dependencies.ffmpeg_path -FfprobePath $dependencies.ffprobe_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveReport = Join-Path $env:GITHUB_WORKSPACE 'docs/codex-v1.0.1/evidence/PATCH104-synthetic-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json'
          if (Test-Path -LiteralPath $archiveReport) { throw 'Synthetic evidence already exists.' }
          Copy-Item -LiteralPath $report -Destination $archiveReport
          $report = Join-Path $env:RUNNER_TEMP 'patch105-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Patch105Recovery.ps1') -EvidencePath $report -FfmpegPath $dependencies.ffmpeg_path -FfprobePath $dependencies.ffprobe_path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveReport = Join-Path $env:GITHUB_WORKSPACE 'docs/codex-v1.0.1/evidence/PATCH105-synthetic-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json'
          if (Test-Path -LiteralPath $archiveReport) { throw 'Synthetic evidence already exists.' }
          Copy-Item -LiteralPath $report -Destination $archiveReport
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/codex-v1/evidence/T17-*-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S08-launcher-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/R1-directlauncher-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S09-encoding-ci-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S10-support-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S06-managedreal-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S11-corpus-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S11-filesystem-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S12-cleanfirst-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/S12-releasegates-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/PATCH104-synthetic-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
            docs/codex-v1.0.1/evidence/PATCH105-synthetic-${{ matrix.edition }}-run${{ github.run_id }}_${{ github.run_attempt }}.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
